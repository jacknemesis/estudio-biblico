<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materias · Berea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#FAF9F6;
    --tarjeta:#FFFFFF;
    --borde:#E8E6E0;
    --tinta:#20242B;
    --tinta-2:#6B7280;
    --acento:#B07D3A;
    --acento-suave:#F7F0E4;
    --fuente:"Poppins",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html{font-size:19px}
  body{margin:0;background:var(--fondo);color:var(--tinta);
       font-family:var(--fuente);font-weight:300;line-height:1.72;
       -webkit-text-size-adjust:100%}
  .marco{max-width:40rem;margin:0 auto;padding:0 1.05rem}
  .portada{padding:2.6rem 0 1.4rem}
  .escuela{font-size:.62rem;font-weight:600;color:var(--acento);
           text-transform:uppercase;letter-spacing:.16em;margin:0 0 .5rem}
  .portada h1{font-size:1.7rem;font-weight:500;line-height:1.25;margin:0;letter-spacing:-.01em}
  .lead{font-size:.88rem;color:var(--tinta-2);margin:.6rem 0 0}

  .lista{list-style:none;margin:1.6rem 0 0;padding:0;display:grid;gap:.8rem}
  .materia{background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px}
  .materia a{display:block;padding:1.3rem 1.2rem;text-decoration:none;color:inherit}
  .materia a:hover{border-radius:14px;background:var(--acento-suave)}
  .m-n{font-size:.6rem;font-weight:600;color:var(--acento);
       text-transform:uppercase;letter-spacing:.16em}
  .materia h2{font-size:1.15rem;font-weight:500;margin:.35rem 0 .3rem;line-height:1.3}
  .materia p{font-size:.88rem;color:var(--tinta-2);margin:0}
  .m-ir{display:inline-block;margin-top:.7rem;font-size:.78rem;
        font-weight:500;color:var(--acento)}

  .vacio{background:var(--tarjeta);border:1px dashed var(--borde);border-radius:14px;
         padding:1.4rem 1.2rem;font-size:.88rem;color:var(--tinta-2)}
  footer{font-size:.78rem;color:var(--tinta-2);padding:2.2rem 0 2.6rem}
</style>
</head>
<body>

<header class="portada marco">
  <p class="escuela" id="escuela">Berea</p>
  <h1>Materias</h1>
  <p class="lead">Estudios bíblicos. Elegí una materia para entrar.</p>
</header>

<main class="marco">
  <ul class="lista" id="lista"></ul>
</main>

<footer class="marco">
  Los resaltados se guardan por materia y se sincronizan entre tus dispositivos.
</footer>

<script>
const lista = document.getElementById("lista");

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

function vacio(txt){
  lista.innerHTML = `<li class="vacio">${esc(txt)}</li>`;
}

fetch("/api/materias", { headers:{ "Accept":"application/json" } })
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    if(d.escuela) document.getElementById("escuela").textContent = d.escuela;
    const ms = d.materias || [];
    if(!ms.length) return vacio("Todavía no hay materias publicadas.");
    lista.innerHTML = ms.map((m, i) => `
      <li class="materia">
        <a href="${esc(m.url)}">
          <span class="m-n">Materia ${i + 1}</span>
          <h2>${esc(m.titulo)}</h2>
          ${m.resumen ? `<p>${esc(m.resumen)}</p>` : ""}
          <span class="m-ir">Entrar &rarr;</span>
        </a>
      </li>`).join("");
  })
  .catch(() => vacio("No se pudo cargar el catálogo de materias."));
</script>
</body>
</html>
